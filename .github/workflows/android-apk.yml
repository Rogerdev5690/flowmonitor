name: APK Android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "simulador/FlowMonitor.jsx"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar e publicar o APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Build web (offline)
        run: npm run build

      - name: Gerar projeto Android
        run: npx cap add android

      - name: Ícone e splash
        continue-on-error: true
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#0c1424' --iconBackgroundColorDark '#0c1424'
          --splashBackgroundColor '#060b16' --splashBackgroundColorDark '#060b16'

      - name: Barra de status escura e número da versão
        env:
          RUN: ${{ github.run_number }}
        run: |
          python3 - <<'EOF'
          import os, re
          run = os.environ["RUN"]
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p).read()
          extra = ('<item name="android:statusBarColor">#060b16</item>'
                   '<item name="android:navigationBarColor">#060b16</item>'
                   '<item name="android:windowLightStatusBar">false</item>')
          s = s.replace('<item name="android:background">@null</item>',
                        '<item name="android:background">@null</item>' + extra, 1)
          open(p, "w").write(s)
          g = "android/app/build.gradle"
          b = open(g).read()
          b = re.sub(r"versionCode \d+", f"versionCode {run}", b)
          b = re.sub(r'versionName "[^"]*"', f'versionName "1.0.{run}"', b)
          open(g, "w").write(b)
          EOF

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Chave de debug fixa (permite atualizar sem desinstalar)
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar na release apk-latest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk FlowMonitor.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest FlowMonitor.apk \
            --target "${{ github.sha }}" \
            --title "FlowMonitor para Android (build ${{ github.run_number }})" \
            --notes "Baixe o FlowMonitor.apk abaixo direto no celular Android.

          1. Toque em FlowMonitor.apk para baixar.
          2. Abra o arquivo baixado. Se o Android pedir, permita instalar apps desta fonte (Chrome ou Arquivos).
          3. Se o Play Protect avisar que o app não foi verificado, toque em Mais detalhes → Instalar mesmo assim.

          Versão simulada do painel, funciona sem internet. Builds novos atualizam por cima do anterior."

      - uses: actions/upload-artifact@v4
        with:
          name: FlowMonitor-apk
          path: FlowMonitor.apk
